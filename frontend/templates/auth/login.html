
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Bazaar-Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='IconFolder/logo.png') }}">
</head>
<body class="public">

<header>
    <nav>
        <h1>Bazaar-Connect</h1>
        <ul>
            <li><a href="{{ url_for('Index') }}">Home</a></li>
            <a href="{{ url_for('About') }}">About</a>
            <li><a href="{{ url_for('Contact') }}">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="auth-container">
    <h2>Login</h2>

    <form>
        <div class="form-group">
            <label>Email</label>
            <input id="EmailPassword" type="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="LoginPassword" type="password" required>
        </div>

        <button id="LoginButton" style="margin-bottom: 20px;">Login</button>
         
        <p style="margin-top: 10px;">Dont have account?  <a href="{{ url_for('Register') }}"> Register</a></p>
    </form>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
